name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Min/max of the requires-python claim (>=3.12) — the endpoints are
        # what break, so the middle version rides for free. UV_PYTHON
        # overrides the committed .python-version pin.
        python-version: ['3.12', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        # --locked: a green build must also prove the committed uv.lock is current.
        run: uv sync --dev --locked
      - name: Lint (ruff)
        run: uv run ruff check lamplighter/ tests/
      - name: Stub the built frontend
        # This job has no Node toolchain, and `Lamplighter(build=False)` refuses
        # to boot when `frontend_dist()` finds nothing — which errored
        # test_live_server's module fixture at SETUP, silently taking the
        # Origin-boundary handshake test with it. That test had therefore never
        # run in CI, which is how main went red unnoticed on 2026-07-22.
        # A stub is all the boot path needs; the real bundle is built by the
        # frontend job and served from an installed wheel by the smoke job.
        #
        # It needs an assets/*.js too: test_static_cache skips itself when
        # there is no dist, so stubbing one un-skips it, and it asserts the
        # immutable-caching half of the policy. Both halves of
        # _HashAwareStatics are real code paths a stub exercises honestly.
        run: |
          mkdir -p frontend/dist/assets
          printf '<!doctype html><title>stub</title><div id="root"></div>' > frontend/dist/index.html
          printf 'export default 0\n' > frontend/dist/assets/index-stub.js
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      # The wheel redistributes these; the notice conditions are not satisfied
      # by Lamplighter's own LICENSE. Fails if a dependency was added or bumped
      # without regenerating THIRD_PARTY_NOTICES.md.
      - name: Third-party notices are current
        run: npm run notices:check
      - name: Run tests
        run: npm test
      # Doubles as the typecheck (tsc -b) and catches build breakage.
      - name: Build
        run: npm run build

  # The gap every other job leaves: nothing here ever installed what we publish
  # or started a real server. The backend job runs against the checkout with no
  # frontend built, so the static mount is skipped entirely and `pip install
  # lamplighter` was never once exercised end to end.
  smoke:
    name: Wheel installs and boots
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build sdist + wheel
        run: uv build
      # --torch-backend cpu, not an --extra-index-url: pointing at the PyTorch
      # index directly makes uv's dependency-confusion guard reject numpy
      # ("found on download.pytorch.org, but not at the requested version").
      # The flag resolves torch from the CPU index and everything else from
      # PyPI, which is what we want and is ~2.5GB lighter than the CUDA wheel.
      - name: Install the wheel into a clean environment
        # With the [mcp] extra, so the extra's declaration and the
        # lamplighter-mcp console script are part of what's smoked.
        run: |
          uv venv /tmp/smoke
          WHEEL=$(ls dist/*.whl)
          uv pip install --python /tmp/smoke/bin/python --torch-backend cpu "${WHEEL}[mcp]"
      - name: Boot it and check what a browser would get
        # From /tmp, NOT the checkout: `python - <<'PY'` reads the script from
        # stdin, so Python puts the current directory at the front of sys.path.
        # Run from the repo and `import lamplighter` binds to ./lamplighter/ —
        # the source tree — and this step silently tests the checkout instead of
        # the wheel it just installed. The site-packages assertion below caught
        # exactly that. A real user is never inside this checkout either.
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/python - <<'PY'
          import json, urllib.request
          import lamplighter
          from lamplighter.backend.dist import frontend_dist

          # The bundled UI must resolve from inside the *installed package*,
          # not from a checkout that happens to be next door.
          dist = frontend_dist()
          assert dist is not None, "installed wheel has no bundled frontend"
          assert "site-packages" in str(dist), f"resolved to the checkout, not the wheel: {dist}"

          sess = lamplighter.Lamplighter(port=0, persist=False, build=False)
          try:
              with urllib.request.urlopen(f"{sess.url}/api/registry", timeout=30) as r:
                  assert r.status == 200 and json.load(r), "registry endpoint is empty"
              with urllib.request.urlopen(sess.url, timeout=30) as r:
                  assert r.status == 200, "the bundled UI is not being served"
                  assert r.headers.get("cache-control") == "no-cache", "index.html is cacheable"
              print("ok:", sess.url, "serves the API and the bundled UI")
          finally:
              sess.stop()
          PY
      - name: check() and the MCP tool work from the wheel
        # Same /tmp discipline as above: prove the INSTALLED copy. Nothing else
        # in CI resolves the [project.scripts] entry point or runs check() from
        # site-packages — the backend job imports the checkout via pythonpath.
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/python - <<'PY'
          import torch, lamplighter
          from torch import nn

          report = lamplighter.check(
              nn.Linear(8, 3),
              (torch.randn(30, 8), torch.full((30,), 5)),
              loss=nn.CrossEntropyLoss(),
          )
          assert not report.ok, "the planted label bug went unreported"
          assert any("has classes 5…5" in r["title"] for r in report.rows)
          print("ok: check() catches the planted bug from the wheel")
          PY
          /tmp/smoke/bin/python - <<'PY'
          import json, subprocess

          msgs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize",
               "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                          "clientInfo": {"name": "smoke", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          payload = "".join(json.dumps(m) + "\n" for m in msgs)
          proc = subprocess.run(["/tmp/smoke/bin/lamplighter-mcp"], input=payload,
                                capture_output=True, text=True, timeout=120)
          tools = []
          for line in proc.stdout.splitlines():
              msg = json.loads(line)
              if msg.get("id") == 2:
                  tools = [t["name"] for t in msg["result"]["tools"]]
          assert tools == ["check_training"], f"handshake failed: {proc.stderr[-500:]}"
          print("ok: lamplighter-mcp serves check_training over stdio")
          PY
      - name: Third-party notices rode along
        run: |
          python3 - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("THIRD_PARTY_NOTICES.md") for n in names), \
              f"{wheel} ships the bundled fonts and JS without their notices"
          print("ok:", wheel, "carries THIRD_PARTY_NOTICES.md")
          PY

  # Release: on a v* tag, build the frontend, build the sdist+wheel (the wheel
  # bundles the UI — see pyproject's force-include), verify the bundle rode
  # along, and publish to **TestPyPI only**. The real index stays untouched
  # until a TestPyPI release has been verified by hand; see the commented block
  # at the bottom.
  #
  # One-time setup before the first tagged release (no long-lived tokens —
  # trusted publishing): on test.pypi.org → your account → Publishing → add a
  # "pending" GitHub publisher for project `lamplighter` with owner
  # `scott-kirila`, repo `Lamplighter`, workflow `ci.yml`, environment
  # `testpypi`. Then `git tag v0.1.0 && git push origin v0.1.0`.
  release:
    name: Build + publish (TestPyPI)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # trusted publishing exchanges this for a PyPI token
      contents: write  # the GitHub Release at the end
    steps:
      - uses: actions/checkout@v4
      # Fail in seconds if the tag doesn't name the version the build would
      # publish — otherwise tagging v0.2.0 over a stale pyproject would ship
      # 0.1.0 from the wrong tag (or die late, at upload, on a duplicate).
      # Pure shell so it assumes nothing about the runner's Python.
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME != pyproject version $version — bump pyproject or retag"
            exit 1
          fi
          echo "ok: $GITHUB_REF_NAME == v$version"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        run: uv build
      - name: Verify the wheel bundles the UI
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "lamplighter/_frontend_dist/index.html" in names, \
              f"{wheel} is missing the bundled frontend"
          print("ok:", wheel, "bundles the UI")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      # A human-facing landing spot for the tag, with the dist files attached.
      # After the publish, so a failed upload never leaves a release
      # announcing artifacts that aren't on the index.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

# --- Real PyPI (deliberately inert) ----------------------------------------
# After a TestPyPI release installs and runs cleanly
#   (uv pip install --index-url https://test.pypi.org/simple/ \
#      --extra-index-url https://pypi.org/simple/ lamplighter)
# add a trusted publisher on pypi.org (same fields, environment `pypi`) and
# enable a job like `release` but with the publish step's repository-url
# removed and `environment: pypi`. Nothing publishes to the real index until
# that block exists.
