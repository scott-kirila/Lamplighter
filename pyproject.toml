[project]
name = "lamplighter"
version = "0.1.0"
description = "Pre-flight checks for PyTorch training runs — catch the label off-by-one, the softmax-under-CrossEntropyLoss, the final-batch-of-1 BatchNorm crash, against your real tensors, before you spend the epoch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NOT fastapi[standard]: that extra exists for the `fastapi dev` CLI, which
    # this project never runs (session.py drives uvicorn.Server directly), and
    # it drags ~24 packages into every install — including fastapi-cloud-cli
    # and sentry-sdk, a cloud-deploy tool and a telemetry SDK, inside a
    # localhost in-kernel tool. The pieces actually needed are named instead.
    # uvicorn's OWN [standard] extra IS load-bearing: it supplies websockets,
    # without which the editor's live sync silently never connects.
    # NOT ipykernel: nothing in this package imports it, IPython, or any kernel
    # API — the server is a plain uvicorn thread that happens to be started
    # from a notebook. Declaring it forced a Jupyter major-version bump on
    # every install for zero functionality, and it doesn't even make the
    # example notebooks runnable on its own (that needs jupyterlab, which is
    # equally not ours to install). It lives in the dev group, where the
    # person running examples/ actually is.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "numpy>=2.5.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]

[project.optional-dependencies]
# Hyperparameter sweeps (the Optimize view / SweepManager). Optional so the
# base wheel's dep tree stays curated; the engine lazy-imports and surfaces
# this exact install hint when absent.
sweep = ["optuna>=4.0"]
# Reinforcement learning (env nodes + the RL recipes). classic-control pulls
# pygame, which the rollout replay's rgb_array rendering needs.
rl = ["gymnasium[classic-control]>=1.0"]

[project.urls]
Repository = "https://github.com/scott-kirila/Lamplighter"
Issues = "https://github.com/scott-kirila/Lamplighter/issues"

# The wheel bundles the BUILT frontend inside the package (so installed users
# need no Node toolchain); frontend/dist must exist at build time — CI builds
# it first (see the release stub in ci.yml). The sdist carries the same built
# bundle so a wheel built FROM the sdist is complete too.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamplighter"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "lamplighter/_frontend_dist"

# The sdist keeps frontend/dist at its REAL path (not inside the package):
# building a wheel from the sdist re-runs the force-include above, which reads
# it from there — one copy, one rule. force-include (not `include`) because
# dist/ is gitignored and hatchling's normal selection respects VCS ignores.
[tool.hatch.build.targets.sdist]
include = ["lamplighter", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

# Dev flow stays deps-only: `uv sync` must NOT build/install the project into
# the venv (it would need frontend/dist present — CI's backend job has no Node —
# and a site-packages copy would shadow the checkout). The package is built
# explicitly via `uv build` (release), never implicitly by sync.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "gymnasium[classic-control]>=1.0",  # the RL recipes' tests (an optional extra for users)
    "httpx>=0.27",  # starlette's TestClient — it rode in on fastapi[standard] before
    "ipykernel>=7.3.0",  # a kernel for examples/*.ipynb; not needed to USE the library
    "matplotlib>=3.9.0",  # example notebooks (viewing generated images, plots)
    "nbstripout>=0.9.1",
    "optuna>=4.0",  # the sweep engine's tests (an optional extra for users)
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# The code favors dense, wide lines (packed prose comments and generated-code
# string literals), so line length is deliberately not enforced. We keep ruff's
# default lint set — pyflakes (F) plus the correctness-focused pycodestyle rules
# (E4/E7/E9) — which catches real issues (unused imports, undefined names,
# ambiguous identifiers) without imposing a formatting style on the existing code.
target-version = "py312"
