[project]
name = "lamplighter"
version = "0.1.0"
description = "Blueprint-style visual PyTorch model builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "ipykernel>=7.3.0",
    "numpy>=2.5.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
